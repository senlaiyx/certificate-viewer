<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Assay</title>
    <style>
        body { 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .cert-container { 
            text-align: center;
            max-width: 500px; 
            width: 100%; 
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.6);
        }
        .loading { font-family: Arial, sans-serif; font-size: 18px; color: #fff; }
    </style>
</head>
<body>

    <div class="cert-container" id="certBox">
        <div class="loading" id="loadingText">Generating your certificate...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const certId = urlParams.get('id');

        // Your new Version 4 Web App URL is plugged in here:
        const scriptURL = "https://script.google.com/macros/s/AKfycbyd-R8m1i4YiCuJTF5lVi341oQGXpgJFLZ8rMGtD9gYim_OS3UxircIroKnx_5KHK_a/exec?id=" + certId;

        if (!certId) {
            document.getElementById('loadingText').innerText = "No Certificate ID provided.";
        } else {
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    if (!data || !data.imageUrl) {
                        document.getElementById('loadingText').innerText = data.error || "Certificate not found.";
                        return;
                    }
                    document.getElementById('certBox').innerHTML = `<img src="${data.imageUrl}" alt="Assay Certificate">`;
                })
                .catch(error => {
                    document.getElementById('loadingText').innerText = "Error loading certificate.";
                    console.error(error);
                });
        }
    </script>
</body>
</html>
